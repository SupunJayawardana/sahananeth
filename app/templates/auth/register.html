{% extends "base.html" %}

{% block title %}Register{% endblock %}


{% block main_class %}
flex items-center justify-center min-h-screen
{% endblock %}



{% block content %}


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">



<style>

*{
    font-family:'Lato',sans-serif;
}


/* Background */

.register-background{

    background:

    linear-gradient(
        135deg,
        #dbeafe,
        #c7d2fe,
        #e0f2fe
    );

}







/* Frame */


.frame-box{


    padding:3px;

    border-radius:30px;


    background:


    linear-gradient(
        120deg,
        #38bdf8,
        #2563eb,
        #8b5cf6,
        #06b6d4
    );


    box-shadow:

    0 0 25px

    rgba(56,189,248,.45);



    animation:

    cardFloat 5s infinite ease-in-out;


}






@keyframes cardFloat{


0%,100%{


transform:

translateY(0)

scale(1);



box-shadow:

0 0 25px

rgba(56,189,248,.35);


}



50%{


transform:

translateY(-8px)

scale(1.01);



box-shadow:

0 0 40px

rgba(124,58,237,.5);


}


}









/* Card */


.register-card{


background:


linear-gradient(

145deg,

#334155,

#475569

);



border-radius:27px;


}








/* Title */


.brand-title{


font-family:'Orbitron',sans-serif;


letter-spacing:3px;



background:


linear-gradient(

90deg,

#38bdf8,

#60a5fa,

#c084fc

);



-webkit-background-clip:text;


-webkit-text-fill-color:transparent;


}





.brand-subtitle{


color:#cbd5e1;


letter-spacing:1px;


}









/* Logo */


.logo-icon{


animation:

logoMove 3s infinite ease-in-out;



filter:


drop-shadow(

0 0 12px

#38bdf8

);


}





@keyframes logoMove{


0%,100%{


transform:

translateY(0);


}


50%{


transform:


translateY(-8px)

rotate(5deg);


}


}









/* Input */


.input-box{


background:white;


color:#1e293b;



border:

1px solid

#cbd5e1;



transition:.3s;


}





.input-box::placeholder{

color:#94a3b8;

}





.input-box:focus{


outline:none;


border-color:#38bdf8;


box-shadow:


0 0 15px

rgba(56,189,248,.35);



transform:

translateY(-2px);


}








/* Button */


.register-button{


background:


linear-gradient(

90deg,

#0284c7,

#2563eb,

#7c3aed

);


transition:.4s;


}





.register-button:hover{


transform:

translateY(-3px);



box-shadow:


0 12px 30px

rgba(37,99,235,.45);


}




label{

color:#f8fafc;

}


</style>










<div class="register-background

min-h-screen

w-full

flex

items-center

justify-center

px-4">







<div class="frame-box">







<div class="register-card

p-7

w-full

max-w-sm">









<div class="text-center mb-5">





<div class="logo-icon text-5xl mb-3">

🛡️

</div>








<h1 class="brand-title text-2xl font-extrabold">

Create Account

</h1>







<p class="brand-subtitle text-xs mt-2">

SAHANANETH — Disaster Relief System

</p>






</div>









<form method="POST" action="/auth/register" class="space-y-3">








<div>


<label class="block text-sm font-semibold">

Username

</label>



<input

type="text"

name="username"

required

placeholder="Choose a username"


class="input-box

mt-1

w-full

px-4

py-2.5

rounded-xl">



</div>









<div>


<label class="block text-sm font-semibold">

Password

</label>




<input

type="password"

name="password"

required

placeholder="Choose a password"


class="input-box

mt-1

w-full

px-4

py-2.5

rounded-xl">



</div>









<div>


<label class="block text-sm font-semibold">

Role

</label>




<select

name="role"

required


class="input-box

mt-1

w-full

px-4

py-2.5

rounded-xl">



<option value="" disabled selected>

Select your role

</option>


<option value="citizen">

Citizen

</option>


<option value="field_officer">

Field Officer

</option>


<option value="gov_officer">

Government Officer

</option>


</select>


</div>









<button

type="submit"

class="register-button

w-full

py-2.5

rounded-xl

text-white

font-bold

text-base">


🚀 Create Account


</button>









</form>









<p class="text-center text-sm text-slate-200 mt-4">


Already have an account?


<a href="/auth/login"

class="text-cyan-300 font-bold hover:underline">


Login here

</a>


</p>







</div>






</div>







</div>



{% endblock %}
