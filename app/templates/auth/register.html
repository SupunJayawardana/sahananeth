{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block main_class %}flex items-center justify-center min-h-screen{% endblock %}

{% block content %}
<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

    <div class="text-center mb-6">
        <div class="text-4xl mb-2">🛡️</div>
        <h1 class="text-2xl font-bold text-blue-800">Create Account</h1>
        <p class="text-gray-500 text-sm mt-1">SAHANANETH — Disaster Relief System</p>
    </div>

    <form method="POST" action="/auth/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Choose a username">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Choose a password">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="role" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="" disabled selected>Select your role</option>
                <option value="citizen">Citizen</option>
                <option value="field_officer">Field Officer</option>
                <option value="gov_officer">Government Officer</option>
            </select>
        </div>

        <button type="submit"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded-lg transition">
            Create Account
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        Already have an account?
        <a href="/auth/login" class="text-blue-600 hover:underline">Login here</a>
    </p>
</div>
{% endblock %}
