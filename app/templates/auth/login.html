{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block main_class %}
flex items-center justify-center min-h-screen
{% endblock %}


{% block content %}


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">


<style>

*{
    font-family:'Lato',sans-serif;
}



/* Background */

.login-background{

    background:

    linear-gradient(
        135deg,
        #dbeafe,
        #c7d2fe,
        #e0f2fe
    );

}







/* Frame + Card Same Animation */


.frame-box{

    padding:3px;

    border-radius:38px;


    background:

    linear-gradient(
        120deg,
        #38bdf8,
        #2563eb,
        #8b5cf6,
        #06b6d4
    );


    box-shadow:

    0 0 25px

    rgba(56,189,248,.45);


    animation:

    cardFloat 5s infinite ease-in-out;


}






@keyframes cardFloat{


    0%,100%{


        transform:

        translateY(0)

        scale(1);



        box-shadow:

        0 0 25px

        rgba(56,189,248,.35);


    }



    50%{


        transform:

        translateY(-12px)

        scale(1.02);



        box-shadow:

        0 0 45px

        rgba(124,58,237,.55);



    }


}









/* Login Card */


.login-card{


    background:


    linear-gradient(

        145deg,

        #334155,

        #475569

    );


    border-radius:35px;


}









/* Brand */


.brand-title{


    font-family:'Orbitron',sans-serif;


    letter-spacing:4px;



    background:


    linear-gradient(

        90deg,

        #38bdf8,

        #60a5fa,

        #c084fc

    );



    -webkit-background-clip:text;


    -webkit-text-fill-color:transparent;



}




.brand-subtitle{


    color:#cbd5e1;


    letter-spacing:1px;


}









/* Logo */


.logo-icon{


    animation:


    logoMove 3s infinite ease-in-out;



    filter:


    drop-shadow(

    0 0 15px

    #38bdf8

    );


}






@keyframes logoMove{


    0%,100%{


        transform:

        translateY(0);


    }



    50%{


        transform:


        translateY(-12px)

        rotate(6deg);


    }


}









/* Input Box */


.input-box{


    background:white;


    color:#1e293b;



    border:

    2px solid

    #e2e8f0;



    transition:.35s;


}






.input-box::placeholder{


    color:#94a3b8;


}





.input-box:hover{


    border-color:#7dd3fc;


}





.input-box:focus{


    outline:none;


    border-color:#38bdf8;



    box-shadow:


    0 0 18px

    rgba(56,189,248,.35);



    transform:


    translateY(-3px);


}









/* Button */


.login-button{


    background:


    linear-gradient(

        90deg,

        #0284c7,

        #2563eb,

        #7c3aed

    );


    transition:.4s;


}






.login-button:hover{


    transform:


    translateY(-4px);



    box-shadow:


    0 15px 35px

    rgba(37,99,235,.45);



}







label{

    color:#f8fafc;

}



</style>









<div class="login-background

min-h-screen

w-full

flex

items-center

justify-center

px-4">







<div class="frame-box">








<div class="login-card

p-10

w-full

max-w-md">









<!-- Header -->


<div class="text-center mb-8">






<div class="logo-icon text-7xl mb-5">

🛡️

</div>







<h1 class="brand-title text-4xl font-extrabold">

SAHANANETH

</h1>








<p class="brand-subtitle text-sm mt-3">

Disaster Relief Management System

</p>







</div>









<!-- Form -->


<form method="POST" action="/auth/login" class="space-y-5">








<div>


<label class="block text-sm font-semibold">

Username

</label>




<input

type="text"

name="username"

required

placeholder="Enter your username"


class="input-box

mt-2

w-full

px-4

py-3

rounded-2xl">



</div>









<div>


<label class="block text-sm font-semibold">

Password

</label>




<input

type="password"

name="password"

required

placeholder="Enter your password"


class="input-box

mt-2

w-full

px-4

py-3

rounded-2xl">



</div>









<button

type="submit"

class="login-button

w-full

py-3

rounded-2xl

text-white

font-bold

text-lg">


🔐 Login


</button>









</form>








<p class="text-center text-sm text-slate-200 mt-6">


Don't have an account?


<a href="/auth/register"

class="text-cyan-300 font-bold hover:underline">


Register here


</a>


</p>









</div>







</div>








</div>



{% endblock %}
