{% extends "base.html" %}
{% block title %}Register Shelter{% endblock %}

{% block content %}
<div class="mx-auto mt-10 max-w-2xl px-4 pb-16">
    <div class="mb-6">
        <div class="eyebrow">Field Officer · Shelter</div>
        <h1 class="mt-1 font-display text-3xl font-semibold text-ink">Register Relief Shelter</h1>
        <p class="mt-1 text-sm text-slate">Fill in the shelter details. Location can be auto-detected or entered manually.</p>
    </div>

    <div class="ledger-card tone-civic p-6 md:p-8">
        <form method="POST" action="/field/shelter/create" class="space-y-5">

            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Shelter Name</label>
                <input type="text" name="shelter_name" required
                    class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                    placeholder="e.g. Negombo North Relief Camp">
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Address</label>
                <input type="text" name="address"
                    class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                    placeholder="Full address of the shelter">
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Maximum Capacity</label>
                <input type="number" name="maximum_capacity" required min="1"
                    class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                    placeholder="e.g. 200">
            </div>

            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Location</label>
                <button type="button" onclick="getLocation()"
                    class="mb-3 inline-flex items-center gap-2 rounded-lg border border-line bg-paper px-4 py-2 text-sm font-medium text-ink transition hover:border-civic hover:text-civic">
                    <svg class="icon" style="width:15px;height:15px"><use href="#icon-pin"/></svg>
                    Auto-detect my location
                </button>
                <p id="location-status" class="mb-2 text-xs text-slate"></p>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate">Latitude</label>
                        <input type="text" name="latitude" id="latitude"
                            class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                            placeholder="e.g. 7.2906">
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate">Longitude</label>
                        <input type="text" name="longitude" id="longitude"
                            class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                            placeholder="e.g. 80.6337">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full">
                Submit for Approval
            </button>
        </form>
    </div>
</div>

<script>
function getLocation() {
    const status = document.getElementById('location-status');
    if (!navigator.geolocation) {
        status.textContent = 'Geolocation is not supported by your browser.';
        return;
    }
    status.textContent = 'Detecting location...';
    navigator.geolocation.getCurrentPosition(
        (position) => {
            document.getElementById('latitude').value = position.coords.latitude.toFixed(6);
            document.getElementById('longitude').value = position.coords.longitude.toFixed(6);
            status.textContent = 'Location detected successfully.';
            status.className = 'mb-2 text-xs text-relief';
        },
        () => {
            status.textContent = 'Could not detect location. Please enter manually.';
            status.className = 'mb-2 text-xs text-rust';
        }
    );
}
</script>
{% endblock %}
