{% extends "base.html" %}
{% block title %}Government Officer Dashboard{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10 px-4">
    <h1 class="text-2xl font-bold text-blue-800 mb-2">
        Welcome, {{ current_user.username }} 👋
    </h1>
    <p class="text-gray-500 mb-6">Government Officer Portal — SAHANANETH</p>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-500">
            <p class="text-sm text-gray-500">Total Citizens</p>
            <p class="text-xl font-bold text-blue-700 mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 border-l-4 border-green-500">
            <p class="text-sm text-gray-500">Active Shelters</p>
            <p class="text-xl font-bold text-green-700 mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 border-l-4 border-yellow-500">
            <p class="text-sm text-gray-500">Warehouses</p>
            <p class="text-xl font-bold text-yellow-700 mt-1">0</p>
        </div>
        <div class="bg-white rounded-xl shadow p-5 border-l-4 border-red-500">
            <p class="text-sm text-gray-500">Pending Requests</p>
            <p class="text-xl font-bold text-red-700 mt-1">0</p>
        </div>
    </div>
</div>
{% endblock %}
