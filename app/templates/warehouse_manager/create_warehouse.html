{% extends "base.html" %}
{% block title %}Submit Warehouse{% endblock %}

{% block content %}
<div class="mx-auto mt-10 max-w-2xl px-4 pb-16">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <div class="eyebrow">Warehouse Manager · Submission</div>
            <h1 class="mt-1 font-display text-3xl font-semibold text-ink">Submit New Warehouse</h1>
        </div>
        <a href="/warehouse/dashboard" class="btn-ghost inline-flex items-center gap-2">
            <svg class="icon" style="width:15px;height:15px"><use href="#icon-arrow-right"/></svg>
            Back
        </a>
    </div>

    <div class="ledger-card tone-civic p-6 md:p-8">
        <p class="mb-4 text-sm text-slate">
            Your warehouse submission will be reviewed by a Government Officer or Admin before activation.
        </p>
        <form method="POST" action="/warehouse/create" class="space-y-4">
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Warehouse Name</label>
                <input type="text" name="warehouse_name" required
                    class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                    placeholder="e.g. Matara South Depot">
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Address</label>
                <input type="text" name="address"
                    class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"
                    placeholder="Full address">
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Location</label>
                <button type="button" onclick="getLocation()"
                    class="mb-2 inline-flex items-center gap-2 rounded-lg border border-line bg-paper px-4 py-2 text-sm font-medium text-ink transition hover:border-civic hover:text-civic">
                    <svg class="icon" style="width:15px;height:15px"><use href="#icon-pin"/></svg>
                    Auto-detect location
                </button>
                <p id="location-status" class="mb-2 text-xs text-slate"></p>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate">Latitude</label>
                        <input type="text" name="latitude" id="latitude"
                            class="w-full rounded-lg border border-line bg-paper px-3 py-2 text-sm text-ink">
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate">Longitude</label>
                        <input type="text" name="longitude" id="longitude"
                            class="w-full rounded-lg border border-line bg-paper px-3 py-2 text-sm text-ink">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-primary w-full">
                Submit for Approval
            </button>
        </form>
    </div>
</div>

<script>
function getLocation() {
    const status = document.getElementById('location-status');
    if (!navigator.geolocation) {
        status.textContent = 'Geolocation not supported.';
        return;
    }
    status.textContent = 'Detecting...';
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
            document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
            status.textContent = 'Location detected.';
            status.className = 'mb-2 text-xs text-relief';
        },
        () => {
            status.textContent = 'Could not detect. Enter manually.';
            status.className = 'mb-2 text-xs text-rust';
        }
    );
}
</script>
{% endblock %}
