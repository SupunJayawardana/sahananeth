{% extends "base.html" %}
{% block title %}Citizen Login{% endblock %}
{% block main_class %}flex items-center justify-center min-h-screen{% endblock %}

{% block content %}
<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
        <div class="text-4xl mb-2">🏠</div>
        <h1 class="text-2xl font-bold text-blue-800">Citizen Login</h1>
        <p class="text-gray-500 text-sm mt-1">SAHANANETH Relief Portal</p>
    </div>

    <form method="POST" action="/citizen/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Your username">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Your password">
        </div>
        <button type="submit"
            class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded-lg transition">
            Login
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        New here?
        <a href="/citizen/register" class="text-blue-600 hover:underline">Register instantly</a>
    </p>
</div>
{% endblock %}
