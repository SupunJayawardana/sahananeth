{% extends "base.html" %}
{% block title %}Citizen Login{% endblock %}
{% block main_class %}flex items-center justify-center min-h-screen contour-bg px-4{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl p-8 md:p-10 w-full max-w-md border border-line">
    <div class="mb-7">
        <div class="w-12 h-12 rounded-lg bg-ink flex items-center justify-center mb-4">
            <svg class="icon-lg text-white"><use href="#icon-user"/></svg>
        </div>
        <div class="eyebrow">Citizen Portal</div>
        <h1 class="font-display text-2xl font-semibold text-ink mt-1">Sign in</h1>
        <p class="text-slate text-sm mt-1">SAHANANETH Relief Portal</p>
    </div>

    <form method="POST" action="/citizen/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-ink mb-1.5">Username</label>
            <input type="text" name="username" required
                class="w-full border border-line rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-civic/40 focus:border-civic"
                placeholder="Your username">
        </div>
        <div>
            <label class="block text-sm font-medium text-ink mb-1.5">Password</label>
            <input type="password" name="password" required
                class="w-full border border-line rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-civic/40 focus:border-civic"
                placeholder="Your password">
        </div>
        <button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
            Sign in
            <svg class="icon" style="width:15px;height:15px"><use href="#icon-arrow-right"/></svg>
        </button>
    </form>

    <p class="text-center text-sm text-slate mt-6">
        New here?
        <a href="/citizen/register" class="text-civic font-medium hover:underline">Register instantly</a>
    </p>
</div>
{% endblock %}
