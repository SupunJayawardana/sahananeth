{% extends "base.html" %}
{% block title %}Citizen Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 px-4">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-blue-800">Citizen Profile</h1>
            <p class="text-gray-500 text-sm mt-1">Submit your personal details for government verification</p>
        </div>
        <a href="/citizen/dashboard" class="text-sm text-blue-600 hover:underline">← Dashboard</a>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <form method="POST" action="/citizen/profile" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" name="full_name" value="{{ profile.full_name if profile else '' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Identification Number</label>
                <input type="text" name="identification_number" value="{{ profile.identification_number if profile else '' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="text" name="phone_number" class="w-full border border-gray-300 rounded-lg px-4 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                <textarea name="address" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded-lg">Submit Profile</button>
        </form>
    </div>
</div>
{% endblock %}
