{% extends "base.html" %}
{% block title %}Citizen Profile{% endblock %}

{% block content %}
<div class="mx-auto mt-10 max-w-2xl px-4 pb-16">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <div class="eyebrow">Citizen · Profile</div>
            <h1 class="mt-1 font-display text-3xl font-semibold text-ink">Citizen Profile</h1>
            <p class="mt-1 text-sm text-slate">Submit your personal details for government verification.</p>
        </div>
        <a href="{% if current_user.role_level == 'field_officer' %}/field/dashboard{% elif current_user.role_level == 'gov_officer' %}/gov/dashboard{% elif current_user.role_level == 'warehouse_manager' %}/warehouse/dashboard{% elif current_user.role_level == 'citizen' %}/citizen/dashboard{% else %}/auth/login{% endif %}" class="btn-ghost inline-flex items-center gap-2">
            <svg class="icon" style="width:15px;height:15px"><use href="#icon-arrow-right"/></svg>
            Back
        </a>
    </div>

    <div class="ledger-card tone-civic p-6 md:p-8">
        <form method="POST" action="/citizen/profile" class="space-y-4">
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Full Name</label>
                <input type="text" name="full_name" value="{{ profile.full_name if profile else '' }}" required class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40" />
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Identification Number</label>
                <input type="text" name="identification_number" value="{{ profile.identification_number if profile else '' }}" required class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40" />
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Phone Number</label>
                <input type="text" name="phone_number" class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40" />
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-medium text-ink">Address</label>
                <textarea name="address" rows="3" class="w-full rounded-lg border border-line bg-paper px-4 py-2.5 text-sm text-ink focus:border-civic focus:outline-none focus:ring-2 focus:ring-civic/40"></textarea>
            </div>
            <button type="submit" class="btn-primary w-full">Submit Profile</button>
        </form>
    </div>
</div>
{% endblock %}
